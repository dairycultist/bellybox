<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>bellybox</title>
    <style>
        body { background: #273653; font-family: sans-serif; display: flex; gap: 1em; }
        a, strong { color: #273653; }
        a:not([href]) { color: grey; }
        h1 { text-align: center; }
        h1 a { color: white; }
        form { border: 1px solid #5a96c9; background: #dbeaf0; padding: 1em; max-width: 30em; margin: 1em 0; }
        th { text-align: left; padding-right: 1em; }
        p {color: #88a; }
        summary { background: white; font-weight: 700; border: 1px solid #5a96c9; border-bottom: 0; background: #dbeaf0; padding: 1em; }
        details form { margin-top: 0; }
        .galleryitem img { height: 200px; }
    </style>
</head>
<body>
    
    <div style="flex: 0 0 300px; width: 300px;">

        <h1><a href="/">bellybox</a></h1>

        <details>
            <summary>Upload</summary>
            <form action="/post_image" method="post" enctype="multipart/form-data">

                <p>Bellybox is a booru for drawings of fat women. Please do not upload thin women, men, excessive slob, gore, or illegal content.</p>

                <table>
                    <tr>
                        <td><label for="image">Image: </label></td>
                        <td><input type="file" id="image" name="image" accept="image/*"></td>
                    </tr>
                </table>

                <!-- tags -->

                <br>
                <input type="submit" value="Upload"/>

            </form>
        </details>

        <form action="/">

            <strong>Filter</strong>
            <p>Only images that match every selected tag will be shown.</p>

            <!-- tags -->

            <br>
            <input type="submit" value="Filter"/>

        </form>

    </div>

    <div style="flex: 1; background: white; padding: 1em; border: 2px solid #5a96c9;">
        <!-- insert -->
    </div>

</body>
</html>
