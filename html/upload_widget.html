<details>
    <summary>Upload</summary>
    <form class="box" action="/post_image" method="post" enctype="multipart/form-data">

        <p><!-- upload description --></p>

        <table>
            <tr>
                <th><label for="image">Image:</label></th>
                <td><input type="file" id="image" name="image" accept="image/*"></td>
            </tr>
            <tr>
                <th><label for="description">Description:</label></th>
                <td><textarea id="description" name="description" rows="4" cols="50" maxlength="600" placeholder="Drawn by xyz, has abc character... (max 600ch)"></textarea></td>
            </tr>
            <tr>
                <th>Tags:</th>
                <td><!-- tags --></td>
            </tr>
        </table>

        <br>
        <input type="submit" value="Upload"/>

    </form>
</details>
