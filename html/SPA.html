<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title><!-- title --></title>
    <style>
        body { background: #273653; font-family: sans-serif; display: flex; gap: 1em; }
        a, strong { color: #273653; }
        a:not([href]) { color: grey; }
        h1 { text-align: center; }
        h1 a { color: white; }
        .box { border: 1px solid #5a96c9; background: #dbeaf0; padding: 1em; margin: 1em 0; }
        table { border-collapse: collapse; }
        th, td { border-bottom: 1px solid #88a; padding: 2px; }
        th { text-align: left; padding-right: 1em; vertical-align: top; }
        p {color: #88a; }
        summary { color: white; font-weight: 700; padding: 0 1em 1em 1em; cursor: pointer; }
        details form { margin-top: 0; }
        .galleryitem img { height: 200px; }
    </style>
</head>
<body>

    <div style="flex: 0 0 300px; width: 300px;">

        <h1><a href="/"><!-- title --></a></h1>

        <div class="box">
            <!-- user -->
        </div>

        <form class="box" action="/">

            <strong>Filter</strong>
            <p>Only images that match every selected tag will be shown.</p>

            <!-- tags -->

            <br>
            <input type="submit" value="Filter"/>

        </form>

    </div>

    <div style="flex: 1;">
        <details>
            <summary>Upload</summary>
            <form class="box" action="/post_image" method="post" enctype="multipart/form-data">

                <p><!-- upload description --></p>

                <table>
                    <tr>
                        <th><label for="image">Image:</label></th>
                        <td><input type="file" id="image" name="image" accept="image/*"></td>
                    </tr>
                    <tr>
                        <th><label for="description">Description:</label></th>
                        <td><textarea id="description" name="description" rows="4" cols="50" maxlength="600" placeholder="Drawn by xyz, has abc character... (max 600ch)"></textarea></td>
                    </tr>
                    <tr>
                        <th>Tags:</th>
                        <td><!-- tags --></td>
                    </tr>
                </table>

                <br>
                <input type="submit" value="Upload"/>

            </form>
        </details>

        <div style="background: white; padding: 1em; border: 2px solid #5a96c9;">
            <!-- insert -->
        </div>
    </div>
    
</body>
</html>
