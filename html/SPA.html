<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title><!-- title --></title>
    <style>
        body { background: #273653; font-family: sans-serif; display: flex; gap: 1em; }
        a, strong { color: #273653; }
        a:not([href]) { color: grey; }
        h1 { text-align: center; }
        h1 a { color: white; }
        .box { border: 1px solid #5a96c9; background: #dbeaf0; padding: 1em; margin: 1em 0; }
        table { border-collapse: collapse; }
        th, td { border-bottom: 1px solid #88a; padding: 2px; }
        th { text-align: left; padding-right: 1em; vertical-align: top; }
        p {color: #88a; }
        summary { color: white; font-weight: 700; padding: 0 1em 1em 1em; cursor: pointer; }
        details form { margin-top: 0; }
        .galleryitem img { height: 200px; }
    </style>
</head>
<body>

    <div style="flex: 0 0 300px; width: 300px;">

        <h1><a href="/"><!-- title --></a></h1>

        <div class="box">
            <!-- user -->
        </div>

        <form class="box" action="/">

            <strong>Filter</strong>
            <p>Only images that match every selected tag will be shown.</p>

            <!-- tags -->

            <br>
            <input type="submit" value="Filter"/>

        </form>

    </div>

    <div style="flex: 1;">
        <!-- upload -->
        <div style="background: white; padding: 1em; border: 2px solid #5a96c9;">
            <!-- insert -->
        </div>
    </div>
    
</body>
</html>
