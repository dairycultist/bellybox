<img src="/img/FILENAME" style="max-width: 100%; max-height: 90vh;">
<table>
    <tr>
        <th>Uploaded: </th>
        <td>UPLOADTIME</td>
    </tr>
    <tr>
        <th>Tags: </th>
        <td>TAGS</td>
    </tr>
    <tr>
        <th>Description: </th>
        <td>DESCRIPTION</td>
    </tr>
</table>
<form action="/request_edit" method="post" enctype="multipart/form-data">
    <input type="hidden" name="id" value="ID">
    <strong>Request edit</strong>
    <br><br>
    <table>
        <tr>
            <td><label for="edit-reason">Reason: </label></td>
            <td><input type="text" id="edit-reason" name="reason" maxlength="280" style="width: 400px;" placeholder="Incorrect tags, inappropriate description... (max 280ch)"></td>
        </tr>
    </table>
    <input type="submit" value="Request"/>
</form>
<form action="/request_delete" method="post" enctype="multipart/form-data">
    <input type="hidden" name="id" value="ID">
    <strong>Request deletion</strong>
    <br><br>
    <table>
        <tr>
            <td><label for="delete-reason">Reason: </label></td>
            <td><input type="text" id="delete-reason" name="reason" maxlength="280" style="width: 400px;" placeholder="Duplicate, inappropriate, broken, copyright... (max 280ch)"></td>
        </tr>
    </table>
    <input type="submit" value="Request"/>
</form>
