<form action="/log_in" method="post" enctype="multipart/form-data">

    <strong>Log in</strong>

    <table>
        <tr>
            <th><label for="username">Username:</label></th>
            <td><input type="text" id="username" name="username" maxlength="32" placeholder="max 32ch"></input></td>
        </tr>
        <tr>
            <th><label for="password">Password:</label></th>
            <td><input type="password" id="password" name="password" maxlength="600" placeholder="max 600ch, go nuts"></input></td>
        </tr>
    </table>

    <br>
    <input type="submit" value="Upload"/>

</form>
